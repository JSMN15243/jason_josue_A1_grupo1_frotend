<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas | AutoRent Express</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">AutoRent Express</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Reservas</a></li>
        <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
      </ul>
    </div>
  </div>
</nav>
<div id="alertContainer"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Reservas</h2>
    <button class="btn btn-primary" id="btnNueva">Nueva reserva</button>
  </div>

  <div class="card card-tabla">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th><th>Reserva</th><th>Cliente</th><th>Vehículo</th><th>Fecha</th>
            <th>Pasajeros</th><th>Días</th><th>Total</th><th>Estado</th><th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaReservas"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="modalReserva" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="formReserva" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="tituloModal">Nueva reserva</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="idReserva">
        <div class="mb-3">
          <label class="form-label" for="selectCliente">Cliente</label>
          <select class="form-select" id="selectCliente" required></select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="selectVehiculo">Vehículo</label>
          <select class="form-select" id="selectVehiculo" required></select>
          <div class="form-text" id="infoVehiculo"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="nombreReserva">Nombre de la reserva</label>
          <input type="text" class="form-control" id="nombreReserva" maxlength="100" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="fechaReserva">Fecha de reserva</label>
            <input type="date" class="form-control" id="fechaReserva" required>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label" for="cantidadPasajeros">Pasajeros</label>
            <input type="number" min="1" class="form-control" id="cantidadPasajeros" required>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label" for="cantidadDias">Días</label>
            <input type="number" min="1" class="form-control" id="cantidadDias" required>
          </div>
        </div>
        <div class="mb-3" id="grupoEstado" style="display:none">
          <label class="form-label" for="selectEstado">Estado</label>
          <select class="form-select" id="selectEstado">
            <option>PENDIENTE</option><option>CONFIRMADA</option>
            <option>CANCELADA</option><option>FINALIZADA</option>
          </select>
        </div>
        <div class="alert alert-secondary mb-0">Total estimado: <strong id="totalEstimado">$0.00</strong>
          <div class="small">El total final lo calcula el servidor.</div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar reserva</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/controllers/indexController.js"></script>
</body>
</html>
