<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | AutoRent Express</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">AutoRent Express</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Reservas</a></li>
        <li class="nav-item"><a class="nav-link active" href="clientes.html">Clientes</a></li>
      </ul>
    </div>
  </div>
</nav>
<div id="alertContainer"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Clientes</h2>
    <button class="btn btn-primary" id="btnNuevo">Nuevo cliente</button>
  </div>

  <div class="card card-tabla">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>Nombre</th><th>Apellido</th><th>Teléfono</th><th>Email</th><th>Dirección</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="modalCliente" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="formCliente" novalidate>
      <div class="modal-header">
        <h5 class="modal-title" id="tituloModal">Nuevo cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="idCliente">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" maxlength="100" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="apellido">Apellido</label>
            <input type="text" class="form-control" id="apellido" maxlength="100" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="telefono">Teléfono</label>
          <input type="text" class="form-control" id="telefono" maxlength="15" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" maxlength="100" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="direccion">Dirección</label>
          <input type="text" class="form-control" id="direccion" maxlength="200">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cliente</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/controllers/clientesController.js"></script>
</body>
</html>
